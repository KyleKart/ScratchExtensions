<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOOM</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      image-rendering: pixelated;
      width: 100vw;
      height: auto;
      max-height: 100vh;
      outline: none;
    }

    #output {
      display: none;
    }
  </style>
</head>

<body>
  <canvas id="screen" width="640" height="400" tabindex="0"></canvas>
  <div id="output"></div>

  <script type="module">
    const memory = new WebAssembly.Memory({ initial: 108 });
    const output = document.getElementById("output");
    const canvas = document.getElementById("screen");
    const doom_screen_width = 640;
    const doom_screen_height = 400;

    function post(type, data = {}) {
      window.parent.postMessage({ type, ...data }, "*");
    }

    function sendScreenshot() {
      canvas.toBlob(blob => {
        const reader = new FileReader();
        reader.onloadend = () => post("screenshot", { image: reader.result });
        reader.readAsDataURL(blob);
      }, "image/jpeg", 0.5);
    }

    function readWasmString(offset, length) {
      return new TextDecoder('utf8').decode(new Uint8Array(memory.buffer, offset, length));
    }

    function appendOutput(style) {
      return (offset, length) => {
        const lines = readWasmString(offset, length).split('\n');
        for (let line of lines) {
          if (!line) continue;
          const span = document.createElement("span");
          span.classList.add(style);
          span.textContent = line;
          output.appendChild(span);
          output.appendChild(document.createElement("br"));
          post("term", { line });
        }
      };
    }

    function getMilliseconds() { return performance.now(); }

    function drawCanvas(ptr) {
      const doom_screen = new Uint8ClampedArray(memory.buffer, ptr, doom_screen_width * doom_screen_height * 4);
      const ctx = canvas.getContext('2d');
      ctx.putImageData(new ImageData(doom_screen, doom_screen_width, doom_screen_height), 0, 0);
    }

    const importObject = {
      js: {
        js_console_log: appendOutput("log"),
        js_stdout: appendOutput("stdout"),
        js_stderr: appendOutput("stderr"),
        js_milliseconds_since_start: getMilliseconds,
        js_draw_screen: drawCanvas
      },
      env: { memory }
    };

    WebAssembly.instantiateStreaming(fetch('doom.wasm'), importObject).then(obj => {
      obj.instance.exports.main();

      const keyDown = code => obj.instance.exports.add_browser_event(0, code);
      const keyUp = code => obj.instance.exports.add_browser_event(1, code);

      const doomKeyCode = keyCode => {
        switch(keyCode){
          case 8: return 127;
          case 17: return 0x80+0x1d;
          case 18: return 0x80+0x38;
          case 37: return 0xac;
          case 38: return 0xad;
          case 39: return 0xae;
          case 40: return 0xaf;
          default:
            if(keyCode>=65 && keyCode<=90) return keyCode+32;
            if(keyCode>=112 && keyCode<=123) return keyCode+75;
            return keyCode;
        }
      }

      canvas.addEventListener('keydown', e => { keyDown(doomKeyCode(e.keyCode)); e.preventDefault(); });
      canvas.addEventListener('keyup', e => { keyUp(doomKeyCode(e.keyCode)); e.preventDefault(); });
      canvas.focus();

      function step() { obj.instance.exports.doom_loop_step(); requestAnimationFrame(step); }
      requestAnimationFrame(step);

      // AUTO STREAM 5 FPS
      setInterval(sendScreenshot, 100);
    });
  </script>
</body>
</html>
